<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">pyNetScope Architecture Overview</title><desc id="desc">Architecture showing Python applications instrumented by pyNetScope, processing and telemetry outputs.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#1d4ed8"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.h{font-size:34px;font-weight:700}.sh{font-size:18px;font-weight:700;fill:#1d4ed8}.t{font-size:15px}.sm{font-size:13px;fill:#475569}.p{fill:#fff;stroke:#93c5fd;stroke-width:2}.c{fill:#f8fafc;stroke:#bfdbfe;stroke-width:1.5}.a{stroke:#1d4ed8;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1200" height="720" fill="#fff"/><text x="600" y="55" text-anchor="middle" class="h">pyNetScope — Architecture Overview</text>
