[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pynetscope"
version = "0.1.0"
description = "Embedded network intelligence for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pyNetScope contributors" }]
keywords = ["network", "observability", "latency", "metrics", "speedtest", "httpx", "requests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
requests = ["requests>=2.28"]
httpx = ["httpx>=0.24"]
aiohttp = ["aiohttp>=3.9"]
fastapi = ["fastapi>=0.100"]
rich = ["rich>=13"]
otel = ["opentelemetry-api>=1.20"]
dev = [
    "pytest>=7",
    "requests>=2.28",
    "httpx>=0.24",
    "aiohttp>=3.9",
    "fastapi>=0.100",
    "rich>=13",
    "opentelemetry-api>=1.20",
    "ruff>=0.5",
    "mypy>=1.8",
    "pyright>=1.1",
]

[project.scripts]
pynetscope = "pynetscope.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["pynetscope*"]

[tool.setuptools.package-data]
pynetscope = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["pynetscope"]
